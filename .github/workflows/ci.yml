name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            template/pyproject.toml.jinja
      - run: uv sync --all-groups --locked
      - run: uv run --no-sync python scripts/lint_template.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: generator
            files: >-
              tests/test_generator_contract.py
              tests/test_docs_and_guidance_contract.py
              tests/test_http_contract.py
          - name: runtime
            files: >-
              tests/test_core_runtime_contract.py
              tests/test_agent_contract.py
              tests/test_deployment_contract.py
          - name: services
            files: >-
              tests/test_persistence_contract.py
              tests/test_redis_and_taskiq_contract.py
              tests/test_profile_contract.py
    name: test (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            template/pyproject.toml.jinja
      - run: uv sync --all-groups --locked
      - run: uv run --no-sync pytest -n 0 --durations=20 ${{ matrix.shard.files }}
